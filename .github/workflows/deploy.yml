name: Deploy DigitalFix BFF to EC2

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: digitalfix-ec2-bff
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/franciscopino/ms-digitalfix-bff:${{ github.sha }}
  CONTAINER_NAME: ms-digitalfix-bff
  TARGET_HOST_IP: ${{ vars.TARGET_HOST_IP }}
  CORS_ALLOWED_ORIGINS: ${{ vars.CORS_ALLOWED_ORIGINS }}
  AZURE_ISSUER_URI: ${{ secrets.AZURE_ISSUER_URI }}
  AZURE_API_AUDIENCE: ${{ secrets.AZURE_API_AUDIENCE }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and test
        run: mvn --batch-mode --no-transfer-progress clean verify

      - name: Validate deployment configuration
        run: |
          for name in TARGET_HOST_IP CORS_ALLOWED_ORIGINS AZURE_ISSUER_URI AZURE_API_AUDIENCE; do
            if [ -z "${!name}" ]; then echo "Missing GitHub variable/secret: $name"; exit 1; fi
          done
          case "$AZURE_ISSUER_URI" in
            https://login.microsoftonline.com/*/v2.0|https://sts.windows.net/*/) ;;
            *) echo "AZURE_ISSUER_URI must be an Entra issuer URL"; exit 1 ;;
          esac

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}
            ghcr.io/franciscopino/ms-digitalfix-bff:latest

      - name: Deploy to shared EC2
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GH_CR_PAT }}
          GHCR_USER: ${{ github.actor }}
          IMAGE: ${{ env.IMAGE }}
          CONTAINER_NAME: ${{ env.CONTAINER_NAME }}
          CORS_ALLOWED_ORIGINS: ${{ env.CORS_ALLOWED_ORIGINS }}
          AZURE_ISSUER_URI: ${{ env.AZURE_ISSUER_URI }}
          AZURE_API_AUDIENCE: ${{ env.AZURE_API_AUDIENCE }}
        with:
          host: ${{ vars.TARGET_HOST_IP }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          envs: GHCR_TOKEN,GHCR_USER,IMAGE,CONTAINER_NAME,CORS_ALLOWED_ORIGINS,AZURE_ISSUER_URI,AZURE_API_AUDIENCE
          script: |
            if [ -z "$GHCR_TOKEN" ]; then echo "Missing GH_CR_PAT"; exit 1; fi
            if ! command -v docker >/dev/null 2>&1; then
              sudo dnf install -y docker
              sudo systemctl enable --now docker
            fi
            sudo systemctl start docker
            sudo docker network create digitalfix-backend-net >/dev/null 2>&1 || true
            printf '%s' "$GHCR_TOKEN" | sudo docker login ghcr.io -u "$GHCR_USER" --password-stdin
            sudo docker pull "$IMAGE"
            sudo docker rm -f "$CONTAINER_NAME" >/dev/null 2>&1 || true
            sudo docker run -d --name "$CONTAINER_NAME" --network digitalfix-backend-net --restart unless-stopped \
              -p 80:8080 \
              -e SERVER_PORT=8080 -e SECURITY_ENABLED=true \
              -e AZURE_ISSUER_URI="$AZURE_ISSUER_URI" -e AZURE_API_AUDIENCE="$AZURE_API_AUDIENCE" \
              -e CORS_ALLOWED_ORIGINS="$CORS_ALLOWED_ORIGINS" \
              -e WORKORDERS_SERVICE_URL=http://ms-digitalfix-workorders:8081 \
              -e CATALOG_SERVICE_URL=http://ms-digitalfix-catalog:8082 \
              -e REPORT_SERVICE_URL=http://ms-digitalfix-report:8084 \
              -e AUDIT_SERVICE_URL=http://ms-digitalfix-audit:8085 \
              "$IMAGE"
            sudo docker image prune -f
